<!-- ═══ DISCORD AUTH — L'PATCH DABA (MOKHTALEF) ═══ -->
<!-- ═══════════════════════════════════════════════════════ -->
<script>
  // ═══════════════════════════════════════════════════════
  //  ⚠️ IMPORTANT: REDIRECT_URI KHASS YKOUN NFS L'URL
  //     LI ZEDTI F DISCORD DEVELOPER PORTAL (OAuth2 → Redirects)
  // ═══════════════════════════════════════════════════════
  const CLIENT_ID = '1525516425299624136';
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  
  // ila bghit t'khelli l'URL fixe (machi dynamic), bddel hadi:
  // const REDIRECT_URI = 'http://127.0.0.1:5500/NEW%20STOR.html';
  // wla
  // const REDIRECT_URI = 'https://4flag-web.vercel.app/';

  const OAUTH2_URL = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;

  function loginWithDiscord() {
    window.location.href = OAUTH2_URL;
  }

  function logoutDiscord() {
    localStorage.removeItem('discord_user');
    window.location.href = window.location.pathname;
  }

  window.addEventListener('DOMContentLoaded', () => {
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = fragment.get('access_token');

    if (accessToken) {
      window.history.replaceState({}, document.title, window.location.pathname);
      fetchDiscordUserData(accessToken);
    } else {
      const savedUser = localStorage.getItem('discord_user');
      if (savedUser) {
        unlockSite(JSON.parse(savedUser));
      } else {
        document.body.style.overflow = 'hidden';
      }
    }
  });

  function fetchDiscordUserData(token) {
    fetch('https://discord.com/api/users/@me', {
      headers: { authorization: `Bearer ${token}` },
    })
      .then(res => res.json())
      .then(user => {
        if (user.id) {
          const avatarUrl = user.avatar
            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
            : `https://cdn.discordapp.com/embed/avatars/0.png`;

          const userData = {
            username: user.global_name || user.username,
            avatar: avatarUrl,
            id: user.id
          };

          localStorage.setItem('discord_user', JSON.stringify(userData));
          unlockSite(userData);
        }
      })
      .catch(err => console.error("Discord Auth Error:", err));
  }

  function unlockSite(user) {
    const lockOverlay = document.getElementById('auth-lock-overlay');
    if (lockOverlay) lockOverlay.classList.add('hidden');
    document.body.style.overflow = 'auto';

    const loginBtn = document.getElementById('discord-login-btn');
    const userProfile = document.getElementById('discord-user-profile');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-username');

    if (loginBtn) loginBtn.classList.add('hidden');
    if (userProfile) userProfile.classList.remove('hidden');
    if (userAvatar) userAvatar.src = user.avatar;
    if (userName) userName.innerText = user.username;
  }
</script>
